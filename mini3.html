<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: rgb(235, 229, 229);
    }

    h1 {
      text-align: center;
      margin: 40px 0;
      color: darkblue;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      display: flex;
      gap: 30px;
      padding: 20px;
    }

    /* Left Form */
    .contact-form {
      flex: 2;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }

    .contact-form h3 {
      margin-bottom: 10px;
    }

    .contact-form p {
      color: rgb(207, 201, 201);
      margin-bottom: 25px;
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 13px;
      margin-bottom: 5px;
      color: #374151;
    }

    input, textarea {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgb(207, 207, 214);
      font-size: 14px;
    }

    textarea {
      resize: none;
      height: 120px;
    }

    .btn {
      margin-top: 15px;
      background: #125800;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background: darkblue;
    }

    
    .contact-info {
      flex: 1;
      background: linear-gradient(180deg, green, rgb(0, 0, 0));
      color: white;
      padding: 30px;
      border-radius: 15px;
    }

    .contact-info h3 {
      margin-bottom: 25px;
    }

    .info-box {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .info-box i {
      font-size: 18px;
    }

    .social {
      margin-top: 25px;
    }

    .social i {
      margin-right: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    .social i:hover {
      color: skyblue;
    }

    @media(max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<h1>Book now</h1><b></b>

<div class="container">

  
  <div class="contact-form">
    <h3>Send us a message</h3>
    <p>Do you have a question or need help? Feel free to contact us.</p>

    <div class="row">
      <div class="input-group">
        <label>First Name</label>
        <input type="text" placeholder="Enter your first name">
      </div>
      <div class="input-group">
        <label>Last Name</label>
        <input type="text" placeholder="Enter your last name">
      </div>
    </div>

    <div class="row">
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label>Contact Details</label>
        <input type="text" placeholder="+91 Enter your number">
      </div>
    </div>

    <div class="input-group">
      <label>Message</label>
      <textarea placeholder="Enter your message"></textarea>
    </div>

    <button class="btn">Send a Message</button>
  </div>

  
  <div class="contact-info">
    <h3>Hi! We are always here to help you.</h3>

    <div class="info-box">
      <i class="fa-solid fa-phone"></i>
      <span>Hotline: +91 6238570850</span>
    </div>

    <div class="info-box">
      <i class="fa-brands fa-whatsapp"></i>
      <span>SMS / WhatsApp: +91 623857850</span>
    </div>

    <div class="info-box">
      <i class="fa-solid fa-envelope"></i>
      <span>Email:  info@keralatourism.comsupport@example.com</span>
    </div>

    <div class="social">
      <i class="fa-brands fa-facebook"></i>
      <i class="fa-brands fa-instagram"></i>
      <i class="fa-brands fa-snapchat"></i>
      <i class="fa-brands fa-tiktok"></i>
      <i class="fa-brands fa-twitter"></i>
    </div>
  </div>

</div>

</body>
</html>
